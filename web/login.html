<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>点歌台 · 登录</title>
<style>
:root{--ink:#0a0c10;--panel:#12161d;--line:rgba(237,231,218,.12);--cream:#ede7da;--dim:#868b96;--amber:#f0a93b;--amber2:#ffd08a;
--mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;--sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;--serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--cream);font:15px/1.6 var(--sans);
background:radial-gradient(900px 520px at 80% -10%,rgba(240,169,59,.18),transparent 60%),radial-gradient(700px 420px at 0% 110%,rgba(87,201,189,.08),transparent 60%),var(--ink)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.7'/></svg>")}
.box{width:360px;padding:34px 30px 30px;background:linear-gradient(180deg,rgba(20,24,33,.94),rgba(15,18,24,.94));border:1px solid var(--line);border-radius:18px;position:relative;animation:rise .6s both}
.box::before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:linear-gradient(140deg,rgba(240,169,59,.45),transparent 40%,transparent 70%,rgba(87,201,189,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
h1{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.08em;margin:0 0 4px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase;margin-bottom:26px;display:block}
label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);margin-bottom:8px}
input{width:100%;background:rgba(10,12,16,.7);border:1px solid var(--line);color:var(--cream);padding:12px 14px;border-radius:9px;outline:none;font-size:15px;letter-spacing:.08em;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(240,169,59,.12)}
button{width:100%;margin-top:18px;background:linear-gradient(180deg,var(--amber2),var(--amber));color:#1a1206;border:0;padding:12px;border-radius:9px;font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer;transition:.18s}
button:hover{filter:brightness(1.06)}
.err{color:#f09a9a;font-size:12.5px;margin:0 0 10px;display:none}
.foot{margin-top:20px;font-family:var(--mono);font-size:10.5px;color:#525863;letter-spacing:.06em;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></head><body>
<form class="box" method="post" action="/login">
<h1>点歌台</h1>
<span class="tag">TeamSpeak · 接待区</span>
<p class="err" id="err">密码不对，再试一次</p>
<label for="p">访问密码</label>
<input id="p" type="password" name="password" placeholder="输入访问密码" autofocus required>
<button type="submit">进入点歌台</button>
<div class="foot">每 IP 每分钟限点 5 首</div>
</form>
<script>if(location.search.includes('err=1'))document.getElementById('err').style.display='block'</script>
</body></html>
