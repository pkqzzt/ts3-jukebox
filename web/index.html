<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>点歌台 · 接待区</title>
<style>
:root{
  --ink:#0a0c10; --panel:#101319; --panel2:#141821;
  --line:rgba(237,231,218,.09); --line2:rgba(237,231,218,.16);
  --cream:#ede7da; --dim:#868b96; --amber:#f0a93b; --amber2:#ffd08a;
  --teal:#57c9bd;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:
    radial-gradient(1100px 620px at 88% -12%, rgba(240,169,59,.17), transparent 62%),
    radial-gradient(900px 520px at -8% 108%, rgba(87,201,189,.09), transparent 60%),
    var(--ink);
  color:var(--cream);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;z-index:99;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.7'/></svg>")}
.app{max-width:1180px;margin:0 auto;padding:26px 26px 16px;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px;animation:rise .7s both}
.brand{display:flex;align-items:baseline;gap:14px}
.brand h1{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.06em;margin:0}
.brand .tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase;border:1px solid rgba(240,169,59,.35);padding:3px 8px;border-radius:3px}
.clock{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.1em}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:26px;align-items:stretch}
main{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.results{flex:1;min-height:0;overflow-y:auto;padding-right:6px}
@media(max-width:900px){
  body{overflow:auto}
  .app{height:auto;padding:20px 16px 40px}
  .grid{display:flex;flex-direction:column}
  main{overflow:visible}
  .results{overflow:visible}
  .side{order:-1}
}

.searchbox{position:relative;margin-bottom:16px;animation:rise .7s .06s both;flex:none}
.searchbox input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);
  color:var(--cream);font:500 22px/1.4 var(--sans);padding:10px 44px 12px 2px;outline:none;transition:border-color .25s}
.searchbox input::placeholder{color:#5c626d;font-weight:400}
.searchbox input:focus{outline:none;box-shadow:none;border-color:var(--amber)}
.searchbox .ico{position:absolute;right:6px;top:12px;color:var(--dim);font-size:18px;pointer-events:none}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em;margin:-10px 0 16px;flex:none}

.results{display:flex;flex-direction:column;animation:rise .7s .12s both}
.track{display:grid;grid-template-columns:26px 52px minmax(0,1fr) auto auto;gap:14px;align-items:center;
  padding:9px 10px;border-radius:10px;transition:background .2s;cursor:default}
.track:hover{background:rgba(237,231,218,.045)}
.track .idx{font-family:var(--mono);font-size:11px;color:#4d525c;text-align:right}
.track .cov{width:52px;height:52px;border-radius:5px;object-fit:cover;background:linear-gradient(135deg,#1b2029,#12151b);display:block}
.track .cov.ph{display:flex;align-items:center;justify-content:center;color:#3d434e;font-size:18px}
.track .meta{min-width:0}
.track .name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .sub{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.track .dur{font-family:var(--mono);font-size:12px;color:#5f6570}
.track .acts{display:flex;gap:6px;opacity:0;transform:translateX(6px);transition:.22s}
.track:hover .acts{opacity:1;transform:none}
.track .acts button{background:var(--amber);color:#1a1206;border:0;padding:7px 14px;border-radius:6px;
  font:600 13px var(--sans);cursor:pointer;white-space:nowrap;transition:.18s}
.track .acts button:hover{filter:brightness(1.07)}
.track .acts button.ins{background:rgba(87,201,189,.13);border:1px solid rgba(87,201,189,.42);color:var(--teal)}
.track .acts button.ins:hover{background:rgba(87,201,189,.25)}
.track .acts button:disabled{opacity:.4;cursor:wait}
@media(max-width:700px){.track{grid-template-columns:46px minmax(0,1fr) auto}.track .idx,.track .dur{display:none}.track .acts{opacity:1;transform:none}.track .acts button{padding:6px 10px;font-size:12px}}

.side{display:flex;flex-direction:column;gap:16px;animation:rise .7s .18s both;min-height:0;overflow-y:auto;padding-right:6px}
.side>*{flex:0 0 auto}
.srcbar{flex:none}
.card{background:linear-gradient(180deg,rgba(20,24,33,.92),rgba(16,19,25,.92));border:1px solid var(--line);border-radius:16px;padding:18px}
.np{position:relative;overflow:hidden}
.np::before{content:"";position:absolute;inset:-40% -30% auto -30%;height:70%;background:radial-gradient(closest-side,rgba(240,169,59,.20),transparent);filter:blur(20px);pointer-events:none}
.np .cover{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:linear-gradient(140deg,#1c222c,#0e1116);box-shadow:0 18px 44px rgba(0,0,0,.55);display:block;position:relative}
.np .cover.ph{display:flex;align-items:center;justify-content:center;font-size:44px;color:#333a46}
.np .label{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--amber);margin:16px 0 6px}
.np .title{font-family:var(--serif);font-size:23px;line-height:1.35;margin:0 0 4px;letter-spacing:.02em}
.np .artist{font-size:13px;color:var(--dim);margin-bottom:16px}
.bar{position:relative;height:4px;background:rgba(237,231,218,.1);border-radius:2px;cursor:pointer}
.bar::after{content:"";position:absolute;left:-8px;right:-8px;top:-9px;bottom:-9px}
.bar .knob{position:absolute;left:0;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:var(--amber2);box-shadow:0 0 8px rgba(240,169,59,.6);opacity:0;transition:opacity .15s;pointer-events:none}
.bar:hover .knob,.bar.dragging .knob{opacity:1}
.times{align-items:center}
.times .seekbtns{display:flex;gap:6px}
.times .seekbtns button{background:transparent;border:1px solid var(--line);color:var(--dim);
  font:500 10px var(--mono);padding:2px 6px;border-radius:4px;cursor:pointer;transition:.15s}
.times .seekbtns button:hover{color:var(--cream);border-color:var(--line2)}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--amber),var(--amber2));box-shadow:0 0 12px rgba(240,169,59,.55);transition:width .5s linear}
.bar.dragging i{transition:none}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#6a707b;margin-top:7px}
.ctrls{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;background:rgba(237,231,218,.06);border:1px solid var(--line);color:var(--cream);padding:10px;border-radius:9px;
  font-size:13px;cursor:pointer;transition:.18s;font-family:var(--sans)}
.btn:hover{background:rgba(237,231,218,.11);border-color:var(--line2)}
.btn.primary{background:var(--amber);color:#1a1206;border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--amber2)}
.qhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.qhead h2{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--dim);margin:0;font-weight:500}
.qhead .cnt{font-family:var(--mono);font-size:11px;color:var(--amber)}
.qlist{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto}
.qitem{display:grid;grid-template-columns:20px minmax(0,1fr) 24px;gap:10px;align-items:center;padding:8px 6px;border-radius:8px}
.qitem:hover{background:rgba(237,231,218,.04)}
.qitem .n{font-family:var(--mono);font-size:11px;color:#4d525c}
.qitem .qn{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .qa{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .x{background:none;border:0;color:#4d525c;font-size:15px;cursor:pointer;padding:0;line-height:1;transition:.15s}
.qitem .x:hover{color:#e06b6b}
.empty{font-size:12.5px;color:#525863;padding:10px 4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#1b2029;border:1px solid var(--line2);color:var(--cream);padding:11px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 14px 40px rgba(0,0,0,.5);transition:.3s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(224,107,107,.5);color:#f3b4b4}

.srcbar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.src{background:transparent;border:1px solid var(--line2);color:var(--dim);padding:6px 15px;border-radius:20px;
  font:500 13px var(--sans);cursor:pointer;transition:.18s}
.src:hover{color:var(--cream);border-color:rgba(237,231,218,.3)}
.src.on{background:rgba(240,169,59,.14);border-color:rgba(240,169,59,.55);color:var(--amber2)}
.src .am{font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.75;margin-left:6px}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--amber);border:1px solid rgba(240,169,59,.4);
  border-radius:3px;padding:1px 4px;margin-right:6px;vertical-align:1px}
.notice{display:none;font-size:12.5px;color:#e2b56f;background:rgba(240,169,59,.08);border:1px solid rgba(240,169,59,.22);
  border-radius:8px;padding:8px 12px;margin:0 0 14px;flex:none}
.notice.show{display:block}
.notice a{color:var(--amber2);cursor:pointer;text-decoration:underline}

.btn.ghost{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--line2);color:var(--dim)}
.btn.ghost:hover{color:var(--cream)}
.more{display:block;width:100%;margin:14px 0 4px;background:rgba(237,231,218,.05);border:1px solid var(--line);
  color:var(--dim);padding:10px;border-radius:9px;font:500 13px var(--sans);cursor:pointer}
.more:hover{color:var(--cream);border-color:var(--line2)}
.qitem{cursor:default}
.qitem[draggable=true]{cursor:grab}
.qitem.dragging{opacity:.35}
.qitem.over{box-shadow:inset 0 2px 0 var(--amber)}
.qlist.hist{max-height:220px}
.qlist.hist .qn{font-size:12.5px;color:#c9c3b6}
.modal{position:fixed;inset:0;background:rgba(6,8,11,.74);backdrop-filter:blur(3px);display:none;align-items:center;
  justify-content:center;padding:22px;z-index:120}
.modal.show{display:flex}
.mbox{width:100%;max-width:520px;background:linear-gradient(180deg,#161b24,#101319);border:1px solid var(--line2);
  border-radius:16px;padding:22px;box-shadow:0 26px 70px rgba(0,0,0,.6)}
.mbox h3{font-family:var(--serif);font-size:20px;margin:0 0 4px;letter-spacing:.03em}
.mbox .sub{font-size:12.5px;color:var(--dim);margin-bottom:14px}
.lyrics{max-height:54vh;overflow:auto;padding-right:6px}
.lyrics div{font-size:13.5px;line-height:1.9;color:#6f7681;transition:color .25s,transform .25s}
.lyrics div.on{color:var(--amber2);transform:translateX(4px)}
.mbox .macts{display:flex;gap:10px;margin-top:16px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a2f39;border-radius:3px}
</style></head><body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>点歌台</h1><span class="tag">TS3 · 接待区</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div class="grid">
    <main>
      <div class="srcbar" id="srcbar"></div>
      <div class="searchbox">
        <input id="q" placeholder="搜歌名 / 歌手，回车" autocomplete="off">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg></span>
      </div>
      <div class="hint">每人每分钟最多 5 首 · 点歌后自动排队播放</div>
      <div class="notice" id="notice"></div>
      <div class="results" id="results"><div class="empty">输入关键词开始搜索</div></div>
    </main>
    <aside class="side">
      <section class="card np">
        <div id="coverWrap"><div class="cover ph">♪</div></div>
        <div class="label">NOW PLAYING</div>
        <h3 class="title" id="npTitle">暂无播放</h3>
        <div class="artist" id="npArtist">—</div>
        <div class="bar" id="bar" title="点击或拖动调整进度"><i id="prog"></i><b class="knob" id="knob"></b></div>
        <div class="times"><span id="tPos">00:00</span><span class="seekbtns"><button onclick="seekBy(-10)" title="后退 10 秒">−10s</button><button onclick="seekBy(10)" title="前进 10 秒">+10s</button></span><span id="tLen">00:00</span></div>
        <div class="ctrls">
          <button class="btn" id="btnToggle" onclick="toggle()">暂停</button>
          <button class="btn primary" onclick="skip()">下一首</button>
        </div>
        <button class="btn ghost" onclick="openLyrics()">歌词</button>
      </section>
      <section class="card">
        <div class="qhead"><h2>QUEUE</h2><span class="cnt" id="qCount">0</span></div>
        <div class="qlist" id="queue"><div class="empty">队列是空的</div></div>
      </section>
      <section class="card">
        <div class="qhead"><h2>HISTORY</h2><span class="cnt" id="hCount">0</span></div>
        <div class="qlist hist" id="history"><div class="empty">还没放过歌</div></div>
      </section>
    </aside>
  </div>
</div>

<div class="modal" id="lyricModal">
  <div class="mbox">
    <h3 id="lyricTitle">歌词</h3>
    <div class="sub" id="lyricSub"></div>
    <div class="lyrics" id="lyricBody"><div>加载中…</div></div>
    <div class="macts"><button class="btn" onclick="closeLyrics()">关闭</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let adding=false, src='', plugins=[], limit=20, searchTimer=null;
let currentSong=null, lastPos=0, lastHistory=[], dragFrom=-1;

async function loadPlugins(){
  const r=await fetch('/api/plugins'); if(r.status===401){location.href='/login';return}
  const d=await r.json(); plugins=d.plugins||[];
  $('srcbar').innerHTML=plugins.map(p=>'<button class="src'+(p.id===src?' on':'')+'" data-s="'+p.id+'" onclick="setSrc(\''+p.id+'\')">'+esc(p.title)+(p.ready?'':'<span class="am">离线</span>')+'</button>').join('');
  if(!src||!plugins.some(p=>p.id===src)){const first=plugins.find(p=>p.ready)||plugins[0];src=first?first.id:''}
  $('srcbar').querySelectorAll('.src').forEach(b=>b.classList.toggle('on',b.dataset.s===src));
}
function notice(text){$('notice').textContent=text;$('notice').className='notice'+(text?' show':'')}
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600)}
function coverHtml(url,cls){if(!url)return '<div class="'+cls+' ph">♪</div>';const u=url.indexOf('music.126.net')>-1?url+'?param=120y120':url;return '<img class="'+cls+'" src="'+u+'" loading="lazy" onerror="this.style.display=\'none\'">'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function setSrc(s){src=s;limit=20;document.querySelectorAll('.src').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$('results').innerHTML='<div class="empty">输入关键词开始搜索</div>';refresh()}

async function search(){
  const q=$('q').value.trim(); if(!q)return;
  $('results').innerHTML='<div class="empty">搜索中…</div>';
  const r=await fetch('/api/search?source='+src+'&q='+encodeURIComponent(q)+'&limit='+limit);
  if(r.status===401){location.href='/login';return}
  const d=await r.json();
  notice(d.ready?'':(d.hint||'该音源暂不可用'));
  if(!d.songs||!d.songs.length){$('results').innerHTML='<div class="empty">没找到，换个关键词试试</div>';return}
  const rows=d.songs.map((s,i)=>'<div class="track">'+
    '<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
    coverHtml(s.cover,'cov')+
    '<div class="meta"><div class="name">'+esc(s.name)+'</div><div class="sub">'+esc(s.artist)+' · '+esc(s.album)+'</div></div>'+
    '<span class="dur">'+fmt(s.duration/1000)+'</span>'+
    '<span class="acts">'+
    '<button onclick=\'add(this,'+JSON.stringify(s).replace(/'/g,"&#39;")+')\'>点歌</button>'+
    '<button class="ins" onclick=\'add(this,'+JSON.stringify(s).replace(/'/g,"&#39;")+',1)\'>插播</button>'+
    '</span></div>').join('');
  const more=d.songs.length>=limit?(limit>=50?'':'<button class="more" onclick="moreResults()">显示更多（'+d.songs.length+' 条，最多 50）</button>'):'';
  $('results').innerHTML=rows+more;
}
function moreResults(){limit=50;search()}

async function add(btn,s,ins){
  if(adding)return; adding=true;
  if(btn){btn.disabled=true;var t0=btn.textContent;btn.textContent='...'}
  const r=await fetch('/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.id,name:s.name,artist:s.artist,album:s.album||'',cover:s.cover||'',duration:s.duration||0,url:s.url||'',storefront:s.storefront||'',isrc:s.isrc||'',source:s.source||src,insert:!!ins})});
  adding=false; if(btn){btn.disabled=false;btn.textContent=t0}
  if(r.status===429){toast('点歌太频繁，每分钟最多 5 首',true);return}
  if(r.status===409){const e=await r.json();toast(e.error||'该音源不可用',true);return}
  if(r.status===401){location.href='/login';return}
  toast((ins?'已插播：':'已加入队列：')+s.name); refresh()
}
function readd(i){const h=lastHistory[i];if(h)add(null,h,false)}

async function toggle(){await fetch('/api/toggle',{method:'POST'});refresh()}
async function skip(){await fetch('/api/skip',{method:'POST'});toast('已切歌');refresh()}
async function rm(i){await fetch('/api/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i})});refresh()}
async function reorder(from,to){await fetch('/api/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:from,to:to})});refresh()}

let lastCover='__init__', lastQSig='__init__', lastHSig='__init__';
async function refresh(){
  const r=await fetch('/api/state'); if(r.status===401){location.href='/login';return}
  const d=await r.json();
  const c=d.current; currentSong=c; lastPos=d.position||0;
  const pos0=d.position||0;
  $('npTitle').textContent=c?(c.status==='downloading'?'下载中 · '+c.name:c.name):(pos0>0?'正在播放…':'暂无播放');
  $('npArtist').textContent=c?(c.artist||'—'):'—';
  const cv=c&&c.cover?c.cover:'';
  if(cv!==lastCover){lastCover=cv;$('coverWrap').innerHTML=coverHtml(cv,'cover')}
  const pos=d.position||0,len=d.length||0;
  lastState={pos:pos,len:len,at:Date.now(),paused:!!d.paused};
  if(!dragging){
    const pct=len?Math.min(100,pos/len*100):0;
    $('prog').style.width=pct+'%';$('knob').style.left=pct+'%';$('tPos').textContent=fmt(pos);
  }
  $('tLen').textContent=fmt(len);
  $('btnToggle').textContent=d.paused?'继续':'暂停';

  const q=d.queue||[]; $('qCount').textContent=q.length;
  const qsig=q.map(x=>x.id+'#'+x.name).join('|');
  if(qsig!==lastQSig){lastQSig=qsig;
    $('queue').innerHTML=q.length?q.map((x,i)=>'<div class="qitem" draggable="true" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+
      '<div><div class="qn">'+(x.source==='applemusic'?'<span class="badge">AM</span>':'')+esc(x.name)+'</div><div class="qa">'+esc(x.artist||'')+'</div></div>'+
      '<button class="x" onclick="rm('+i+')">×</button></div>').join(''):'<div class="empty">队列是空的</div>'}

  const h=d.history||[]; lastHistory=h; $('hCount').textContent=h.length;
  const hsig=h.map(x=>x.id).join('|');
  if(hsig!==lastHSig){lastHSig=hsig;
    $('history').innerHTML=h.length?h.slice(0,20).map((x,i)=>'<div class="qitem" onclick="readd('+i+')" title="再点一次">'+
      '<span class="n">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div><div class="qn">'+(x.source==='applemusic'?'<span class="badge">AM</span>':'')+esc(x.name)+'</div><div class="qa">'+esc(x.artist||'')+'</div></div>'+
      '<span class="n">+</span></div>').join(''):'<div class="empty">还没放过歌</div>'}

  if($('lyricModal').classList.contains('show'))highlightLyric(lastPos);
}

let dragging=false, dragPct=0, lastState={pos:0,len:0,at:Date.now(),paused:false};
const barEl=$('bar');
function barPct(e){const r=barEl.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}
function paintDrag(){const pct=dragPct*100;$('prog').style.width=pct+'%';$('knob').style.left=pct+'%';$('tPos').textContent=fmt(dragPct*lastState.len)}
if(barEl){
  barEl.addEventListener('pointerdown',e=>{if(!lastState.len)return;dragging=true;barEl.classList.add('dragging');
    try{barEl.setPointerCapture(e.pointerId)}catch(x){}dragPct=barPct(e);paintDrag()});
  barEl.addEventListener('pointermove',e=>{if(!dragging)return;dragPct=barPct(e);paintDrag()});
  const finish=e=>{if(!dragging)return;dragging=false;barEl.classList.remove('dragging');
    const pos=dragPct*lastState.len;if(pos>=0)seekTo(pos)};
  barEl.addEventListener('pointerup',finish);
  barEl.addEventListener('pointercancel',()=>{dragging=false;barEl.classList.remove('dragging')});
}
function estimatePos(){const extra=lastState.paused?0:(Date.now()-lastState.at)/1000;return Math.min(lastState.len||1e9,lastState.pos+extra)}
async function seekTo(pos){
  if(!lastState.len){toast('这个音源不支持拖动进度',true);return}
  try{const r=await fetch('/api/seek',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position:Math.max(0,pos)})});
    if(!r.ok){const e=await r.json().catch(()=>({}));toast(e.error||'跳转失败',true);return}
    toast('已跳到 '+fmt(pos));refresh();
  }catch(e){toast('跳转失败',true)}
}
function seekBy(delta){seekTo(Math.min(lastState.len-1,Math.max(0,estimatePos()+delta)))}

let lyricLines=[];
async function openLyrics(){
  const c=currentSong;
  if(!c){toast('当前没有在放的歌',true);return}
  $('lyricTitle').textContent=c.name||'歌词';
  $('lyricSub').textContent=c.artist||'';
  $('lyricBody').innerHTML='<div>加载中…</div>';
  $('lyricModal').classList.add('show');
  try{
    const r=await fetch('/api/lyrics?source='+encodeURIComponent(c.source)+'&id='+encodeURIComponent(c.id));
    if(!r.ok){$('lyricBody').innerHTML='<div>这个音源暂时没有歌词</div>';return}
    const d=await r.json(); lyricLines=d.lines||[];
    if(!lyricLines.length){$('lyricBody').innerHTML='<div>暂无歌词</div>';return}
    $('lyricBody').innerHTML=lyricLines.map(x=>'<div>'+esc(x.text)+'</div>').join('');
    highlightLyric(lastPos);
  }catch(e){$('lyricBody').innerHTML='<div>歌词加载失败</div>'}
}
function closeLyrics(){$('lyricModal').classList.remove('show')}
function highlightLyric(pos){
  if(!lyricLines.length)return;
  let idx=-1;
  for(let i=0;i<lyricLines.length;i++){if(lyricLines[i].t<=pos)idx=i;else break}
  const rows=$('lyricBody').children;
  for(let i=0;i<rows.length;i++){rows[i].className=(i===idx?'on':'')}
  if(idx>=0&&rows[idx])rows[idx].scrollIntoView({block:'center',behavior:'smooth'})
}

$('queue').addEventListener('dragstart',e=>{const el=e.target.closest('.qitem');if(!el)return;dragFrom=+el.dataset.i;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
$('queue').addEventListener('dragend',()=>{document.querySelectorAll('.qitem').forEach(x=>x.classList.remove('dragging','over'));dragFrom=-1});
$('queue').addEventListener('dragover',e=>{const el=e.target.closest('.qitem');if(!el||dragFrom<0)return;e.preventDefault();document.querySelectorAll('.qitem').forEach(x=>x.classList.remove('over'));el.classList.add('over')});
$('queue').addEventListener('drop',e=>{const el=e.target.closest('.qitem');if(!el||dragFrom<0)return;e.preventDefault();const to=+el.dataset.i;document.querySelectorAll('.qitem').forEach(x=>x.classList.remove('over'));if(to!==dragFrom)reorder(dragFrom,to)});

function tick(){const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);limit=20;search()}});
$('q').addEventListener('input',()=>{clearTimeout(searchTimer);const v=$('q').value.trim();if(!v)return;searchTimer=setTimeout(()=>{limit=20;search()},380)});
tick();setInterval(tick,10000);
loadPlugins().then(refresh);
setInterval(refresh,2000);setInterval(loadPlugins,60000);
</script></body></html>
