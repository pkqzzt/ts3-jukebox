name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python3 -m compileall -q jukebox scripts
      - name: Smoke tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate config example
        run: python3 -c "from jukebox.config import Config; c=Config.load('config.example.toml'); print(c.get('plugins','enabled'))"
